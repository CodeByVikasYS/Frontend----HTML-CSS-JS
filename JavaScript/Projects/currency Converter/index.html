<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css" integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="D:\Downloads\Web Dev\JavaScript\Projects\currency Converter\style.css">
</head>
<body>
    <div class="conatiner">
        <h2>Currency Converter</h2>
        <form class ="amount">
            <p>Enter amount</p>
            <input value ="100" type = "number">
            <div class="dropdown">
                <div class="from">
                    <p>From</p>
                    <div class="select-conatiner">
                        <img src="https://flagsapi.com/US/flat/64.png" alt="country-image">
                        <select name="from" id="">
                            <option value="USD">USD</option>
                            <option value="INR">INR</option>
                            <option value="EURO">EURO</option>
                            <option value="AUD">AUD</option>
                        </select>
                    </div>     
                </div>
                <i class="fa-solid fa-arrow-right-arrow-left"></i>
                <div class="to"></div>
                    <p>To</p>
                    <div class="select-conatiner">
                        <img src="https://flagsapi.com/IN/flat/64.png" alt="country-image">
                        <select name="to" id="">
                            <option value="USD">USD</option>
                            <option value="INR" selected>INR</option>
                            <option value="EURO">EURO</option>
                            <option value="AUD">AUD</option>
                        </select>
                    </div>     
            </div>
            <div class="msg">1USD = 80INR</div>
            <button>Get Exchange Rate</button>
        </form>    
    </div>
    <script src="D:\Downloads\Web Dev\JavaScript\Projects\currency Converter\app.js"></script>
</body>
</html>
