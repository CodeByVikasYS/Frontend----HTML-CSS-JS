<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXORA — Contact</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header class="navbar">
        <div class="logo">NEXORA</div>
        <nav>
            <a href="index.html">Home</a>
            <a href="services.html">Services</a>
            <a href="about.html">About</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <main>
        <section class="page-header">
            <h1>Contact Us</h1>
            <p>Let's start a conversation about your next project.</p>
        </section>

        <section class="contact-section">
            <div class="contact-info">
                <h2>Get In Touch</h2>
                <p>Email: hello@nexora.com</p>
                <p>Phone: +1 (555) 123-4567</p>
                <p>Address: 123 Innovation Drive, Tech City</p>
            </div>

            <div class="contact-form">
                <form action="#" method="POST">
                    
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" required>

                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>

                    <label for="subject">Subject</label>
                    <input type="text" id="subject" name="subject" required>

                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="5" required></textarea>

                    <button type="submit" class="button">Send Message</button>
                    
                </form>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 NEXORA Digital Innovation Studio. All rights reserved.</p>
    </footer>

</body>
</html>
